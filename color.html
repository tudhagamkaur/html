<!DOCTYPE html>
<html>
    <head>
        <style>
           #p1 {background-color:#ff0000;}
           #p2 {background-color:#00ff00;}
           #p3 {background-color:#0000ff;}
           #p4 {background-color:#ffff00;}
           #p5 {background-color:#00ffff;}

        </style>
    </head>
    <body>
        <h2>CSS color property</h2>
        <p>
           A hexadecimal color is specified with:#RRGGBB,where the RR(red),GG(green),BB(blue) color.
           All values must be between 00 and FF.
        </p>
        <p id="p1">Red</p>
        <p id="p2">green</p>
        <p id="p3">blue</p>
        <p id="p4">yellow</p>
        <p id="p5">cyan</p>

    </body>
</html>
