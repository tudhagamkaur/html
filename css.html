<!DOCTYPE html>
<html>
    <head>
        <Style>
            p.dotted{border-style:dotted;}
            p.dashed{border-style:dashed;}
            p.solid{border-style:solid;}
            p.double{border-style:double;}
            p.inset{border-style:inset;}
        </Style>
    </head>
    <body>
        <h2>border style property</h2>
        <p>this property specifies the type of border to display</p>
        <p class="dotted">this is a dotted border</p>
        <p class="dashed">this is a dashed border</p>
        <p class="solid">this is a solid border</p>
        <p class="double">this is a double border</p>
        <p class="inset">this is an inset border</p>
    </body>
</html>
<html>
    <head>
        <style>
            h1{text-decoration:underline;}
            h2{text-decoration:overline;}
            h3{text-decoration:line-through;}
        </style>
    </head>
    <body>
        <h1>this is an underline</h1>
        <h2>this is an overline</h2>
        <h3>this is a line-through</h3>
</html>

<html>
    <head>
        <style>
            h1{text-shadow: 2px 2px red;}
        </style>
    </head>
    <body>
        <h1>this is a text shadow</h1>
    </body>
</html>
