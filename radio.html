<!DOCTYPE html>
<html>
    <body>
        <h1>The radio element</h1>
        <form action="">
            <p><label for="r1">Radio Description</label>
            </p>
            <input type="radio" id="r1" name="radio1" value="option1">
            <label for="r1">Option 1</label><br>
            <input type="radio" id="r2" name="radio1" value="option2">
            <label for="r2">Option 2</label><br>
            <input type="radio" id="r3" name="radio1" value="option3">
            <label for="r3">Option 3</label><br><br>
            <input type="submit" value="Submit">
            <p><label for="r2">Checkbox Description</label></p>
            <input type="checkbox" id="r2" name="checkbox1" value="fruits">
            <label for="r2">Fruits</label><br>
            <input type="checkbox" id="r3" name="checkbox1" value="vegetables">
            <label for="r3">Vegetables</label><br>
            <input type="checkbox" id="r4" name="checkbox1" value="dairy" checked>
            <label for="r4">Dairy</label><br>
            <input type="submit" value="Submit">
            <br><br>
            <p><h3>Dropdown list</h3></p>
            <label for="cars">Choose a car:</label>
            <select id="cars" name="cars" >
                <option value="select">Select car</option>
                <option value="volvo">Volvo</option>
                <option value="bmw">BMW</option>
                <option value="mercedes">Mercedes</option>
                <option value="audi">Audi</option>
            </select>
        </form>
        </body>
</html>
