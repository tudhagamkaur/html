<!DOCTYPE html>
<html>
    <body>
        <h1>The textarea element</h1>
        <form action="">
            <p><label for="ta1"> TextArea Description</label>
            </p>
            <textarea id="ta1" name="textarea1" rows="4" cols="50">We are learning textarea under forms and it is very useful control for multiline inputs</textarea>
            <br>
            <input type="submit" value="Submit"><br><br>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username"><br><br>
            <label for="password">Password:</label><br>
            <input type="password" id="pwd" name="pwd"><br><br>
            <input type="text" style="-webkit-text-security:square;" placeholder="Enter password"><br><br>
            <input type="submit" value="Submit"> 
        </form>
    </body>
</html>
